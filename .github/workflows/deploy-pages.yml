name: Deploy Next.js Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "Kirameku/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./Kirameku
        run: pnpm install --frozen-lockfile

      - name: Approve pnpm builds
        working-directory: ./Kirameku
        run: pnpm approve-builds --all || true

      - name: Build Next.js Static Export
        working-directory: ./Kirameku
        env:
          STATIC_EXPORT: "true"
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
        run: |
          pnpm run build
          touch out/.nojekyll
          node -e '
            const fs = require("fs");
            const p = "out/404.html";
            if (fs.existsSync(p)) {
              let html = fs.readFileSync(p, "utf8");
              const code = `<script>(function(){try{var p=window.location.pathname,pm=p.match(/^\\/posts\\/([^/]+)/);if(pm&&pm[1]&&pm[1]!=="_fallback"){window.location.replace("/posts/_fallback?slug="+encodeURIComponent(decodeURIComponent(pm[1]))+window.location.search+window.location.hash);return;}var nm2=p.match(/^\\/novel\\/([^/]+)\\/([^/]+)/);if(nm2&&nm2[1]&&nm2[2]&&nm2[1]!=="_fallback"){window.location.replace("/novel/_fallback/0?bookUrl="+encodeURIComponent(decodeURIComponent(nm2[1]))+"&chapter="+encodeURIComponent(decodeURIComponent(nm2[2]))+window.location.search+window.location.hash);return;}var nm1=p.match(/^\\/novel\\/([^/]+)/);if(nm1&&nm1[1]&&nm1[1]!=="_fallback"&&nm1[1]!=="search"){window.location.replace("/novel/_fallback?bookUrl="+encodeURIComponent(decodeURIComponent(nm1[1]))+window.location.search+window.location.hash);return;}}catch(e){}})();</script>`;
              html = html.replace("<head>", "<head>" + code);
              fs.writeFileSync(p, html);
            }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Kirameku/out"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
